services:
  - type: web
    name: nse-bse-api-explorer
    runtime: node
    buildCommand: >-
      npm ci --include=dev && npm run build &&
      python3 -m venv node_modules/.cache/lightgbm/venv &&
      node_modules/.cache/lightgbm/venv/bin/python -m pip install -r scripts/forecast/lightgbm-requirements.txt &&
      node_modules/.cache/lightgbm/venv/bin/python -c "import lightgbm, numpy, sklearn; print('LightGBM', lightgbm.__version__)"
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: HOST
        value: 0.0.0.0